<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VEX Lab Console · Paste → Run</title>
  <style>
    :root{
      --bg:#05060a; --panel:#0f1320; --edge:#202634;
      --text:#e9ecff; --muted:#9aa0b8; --accent:#39f7c5;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#171b26 0,#05070b 55%);color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
    header{display:flex;gap:10px;align-items:center;justify-content:space-between;
      padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
    header .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .tag{font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--muted)}
    button{
      appearance:none;border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      color:var(--text); padding:8px 10px;border-radius:10px; cursor:pointer;
      font-weight:600;
    }
    button:hover{border-color:rgba(57,247,197,.55)}
    .wrap{display:grid;grid-template-columns: 1fr 1.2fr;gap:12px;padding:12px;min-height:calc(100vh - 54px)}
    .panel{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.08); border-radius:14px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.55)}
    .panel h2{
      margin:0;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);
      font:700 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;color:var(--muted);
      display:flex;justify-content:space-between;align-items:center;
    }
    textarea{
      width:100%; height:calc(100% - 40px);
      background:transparent; color:var(--text);
      border:0; outline:none; resize:none; padding:12px;
      font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;
    }
    iframe{
      width:100%; height:calc(100% - 40px);
      border:0; background:#000;
    }
    .status{font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
    @media (max-width: 980px){
      .wrap{grid-template-columns:1fr; grid-template-rows: 52vh 1fr;}
    }
  </style>
</head>
<body>
  <header>
    <div class="left">
      <div class="tag">VEX LAB CONSOLE</div>
      <div class="status" id="status">Ready.</div>
    </div>
    <div class="left">
      <button id="runBtn">Run</button>
      <button id="clearBtn">Clear</button>
      <button id="loadExampleBtn">Load Example</button>
      <button id="downloadBtn">Download HTML</button>
    </div>
  </header>

  <div class="wrap">
    <section class="panel">
      <h2><span>PASTE HTML</span><span class="status">Editor</span></h2>
      <textarea id="src" spellcheck="false"></textarea>
    </section>

    <section class="panel">
      <h2><span>OUTPUT</span><span class="status">Sandboxed iframe</span></h2>
      <!-- allow-scripts lets your code run; no same-origin blocks it from touching the parent page -->
      <iframe id="out" sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock allow-popups"></iframe>
    </section>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id);
    const src = $("src"), out = $("out"), status = $("status");

    function setStatus(msg){ status.textContent = msg; }

    function run(){
      const html = src.value || "";
      const blob = new Blob([html], {type:"text/html;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      out.src = url;
      setStatus("Running (blob URL).");
      // clean up old blob URLs after a moment
      setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 5000);
      localStorage.setItem("vex_lab_last", html);
    }

    function clearAll(){
      src.value = "";
      out.src = "about:blank";
      setStatus("Cleared.");
      localStorage.removeItem("vex_lab_last");
    }

    function download(){
      const html = src.value || "";
      const blob = new Blob([html], {type:"text/html;charset=utf-8"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "vex-snippet.html";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      setStatus("Downloaded vex-snippet.html");
    }

    function loadExample(){
      src.value = `<!doctype html>
<html>
<head><meta charset="utf-8"><title>VEX Example</title>
<style>body{margin:0;background:#05060a;color:#fff;font-family:system-ui}
svg{width:100vw;height:100vh}</style></head>
<body>
<svg viewBox="-120 -120 240 240" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#39f7c5" stroke-width="2">
    <path d="M 0,-90 C 60,-90 90,-40 90,0 C 90,40 60,90 0,90 C -60,90 -90,40 -90,0 C -90,-40 -60,-90 0,-90 Z"/>
  </g>
</svg>
</body></html>`;
      setStatus("Loaded example. Hit Run.");
    }

    $("runBtn").addEventListener("click", run);
    $("clearBtn").addEventListener("click", clearAll);
    $("downloadBtn").addEventListener("click", download);
    $("loadExampleBtn").addEventListener("click", loadExample);

    // restore last session
    const last = localStorage.getItem("vex_lab_last");
    if(last){ src.value = last; setStatus("Restored last session. Hit Run."); }
    else { loadExample(); }
  </script>
</body>
</html>
